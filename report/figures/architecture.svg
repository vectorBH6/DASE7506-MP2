   <g id="text_2">
    <text style="fill: #17364a; font: 6.9px 'DejaVu Sans'" transform="translate(38.587181 50.589435)">Question + 4 candidate texts</text>
    <text style="fill: #17364a; font: 6.9px 'DejaVu Sans'" transform="translate(40.408134 59.102364)">Fixed embeddings: 4 x 1024</text>
   </g>
   <g id="text_3">
    <text style="fill: #17364a; font: 700 8.2px 'DejaVu Sans'; text-anchor: middle" x="260.9856" y="36.800629" transform="rotate(-0 260.9856 36.800629)">Canonical answer groups</text>
   </g>
   <g id="text_4">
    <text style="fill: #17364a; font: 6.9px 'DejaVu Sans'" transform="translate(221.570428 50.589435)">Official numeric parser</text>
    <text style="fill: #17364a; font: 6.9px 'DejaVu Sans'" transform="translate(202.274147 59.102364)">Same final answer -&gt; same group</text>
   </g>
   <g id="text_5">
    <text style="fill: #147d79; font: 700 8.2px 'DejaVu Sans'; text-anchor: middle" x="431.5392" y="38.598687" transform="rotate(-0 431.5392 38.598687)">Question-local computation</text>
   </g>
   <g id="text_6">
    <text style="fill: #17364a; font: 6.9px 'DejaVu Sans'" transform="translate(396.558356 53.357811)">No reference access</text>
    <text style="fill: #17364a; font: 6.9px 'DejaVu Sans'" transform="translate(369.999286 62.132886)">Same frozen method for new banks</text>
   </g>
   <g id="text_7">
    <text style="fill: #17364a; font: 700 8.2px 'DejaVu Sans'; text-anchor: middle" x="89.2224" y="114.822146" transform="rotate(-0 89.2224 114.822146)">2,048 embedding columns</text>
   </g>
   <g id="text_8">
    <text style="fill: #17364a; font: 6.9px 'DejaVu Sans'; text-anchor: middle" x="89.2224" y="132.867417" transform="rotate(-0 89.2224 132.867417)">Group mean + mean x group context</text>
   </g>
   <g id="text_9">
    <text style="fill: #17364a; font: 700 8.2px 'DejaVu Sans'; text-anchor: middle" x="260.9856" y="114.822146" transform="rotate(-0 260.9856 114.822146)">40 existing scalar slots</text>
   </g>
   <g id="text_10">
    <text style="fill: #17364a; font: 6.9px 'DejaVu Sans'; text-anchor: middle" x="260.9856" y="132.867417" transform="rotate(-0 260.9856 132.867417)">Votes, similarity, math/text evidence</text>
   </g>
   <g id="text_11">
    <text style="fill: #17364a; font: 700 8.2px 'DejaVu Sans'; text-anchor: middle" x="431.5392" y="114.854177" transform="rotate(-0 431.5392 114.854177)">24 new lexical/numeric columns</text>
   </g>
   <g id="text_12">
    <text style="fill: #17364a; font: 6.9px 'DejaVu Sans'; text-anchor: middle" x="431.5392" y="132.867417" transform="rotate(-0 431.5392 132.867417)">12 candidate signals: mean and max</text>
   </g>
   <g id="text_13">
    <text style="fill: #17364a; font: 700 8.2px 'DejaVu Sans'; text-anchor: middle" x="89.2224" y="193.845291" transform="rotate(-0 89.2224 193.845291)">Training-only supervision</text>
   </g>
   <g id="text_14">
    <text style="fill: #17364a; font: 6.9px 'DejaVu Sans'" transform="translate(39.285806 209.795504)">Five-fold train CV; seed 7506</text>
    <text style="fill: #17364a; font: 6.9px 'DejaVu Sans'" transform="translate(54.397884 218.308433)">L-BFGS-B; L2 = 0.03</text>
   </g>
   <g id="text_15">
    <text style="fill: #17364a; font: 700 8.2px 'DejaVu Sans'; text-anchor: middle" x="260.9856" y="193.877322" transform="rotate(-0 260.9856 193.877322)">Frozen linear scorer</text>
   </g>
   <g id="text_16">
    <text style="fill: #17364a; font: 6.9px 'DejaVu Sans'" transform="translate(188.807288 209.795504)">Concat 2,112 columns; standardize + clip</text>
    <text style="fill: #17364a; font: 6.9px 'DejaVu Sans'" transform="translate(217.956553 218.308433)">s(group) = w^T z(group)</text>
   </g>
   <g id="text_17">
    <text style="fill: #17364a; font: 700 8.2px 'DejaVu Sans'; text-anchor: middle" x="431.5392" y="193.877322" transform="rotate(-0 431.5392 193.877322)">Return a supplied candidate</text>
   </g>
   <g id="text_18">
    <text style="fill: #17364a; font: 6.9px 'DejaVu Sans'" transform="translate(379.861973 209.795504)">Highest-scoring answer group</text>
